name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python --version

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # cron is not a dependency of this project.  ubuntu-latest ships the
      # cron package, so the cross-check gets a real vixie-cron oracle here;
      # it exits 0 with a message when no crontab binary is present.
      - name: Cross-check against the real vixie cron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cron
          python scripts/cross-check-cron.py
